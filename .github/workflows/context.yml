name: contextfile
on: push
jobs: 
  describe:
    runs-on: ubuntu-latest
    steps:
      - name: print all the context files
        run: |
          echo "REPOSITORY: ${{ github.repository }}"
          echo "BRANCH: ${{ github.ref_name }}"
          echo "COMMIT: ${{ github.sha }}"
          echo "EVENT: ${{ github.event_name }}"
          echo "RUNNER OS: ${{ runner.os }}"
